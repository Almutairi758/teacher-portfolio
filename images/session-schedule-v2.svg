<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="990" viewBox="0 0 1400 990">
<rect width="1400" height="990" fill="#ffffff"/>
<style>
text{font-family:Tahoma,Arial,sans-serif;fill:#17384a}.h{font-size:31px;font-weight:700}.m{font-size:22px;font-weight:700}.s{font-size:18px}.th{fill:#247f7b}.tht{fill:#fff;font-size:20px;font-weight:700}.cell{fill:#fff;stroke:#9db9c4;stroke-width:1.4}.day{fill:#eef7f7;stroke:#9db9c4;stroke-width:1.4}.sig{font-size:20px;font-weight:700}
</style>
<!-- top identity -->
<image href="https://almutairi758.github.io/school-evidence/moe-logo-clean.png" x="570" y="25" width="260" height="115" preserveAspectRatio="xMidYMid meet"/>
<text x="210" y="48" class="m" text-anchor="middle" direction="rtl">الإدارة العامة للتعليم بمنطقة الرياض</text>
<text x="210" y="82" class="s" text-anchor="middle" direction="rtl">مدرسة عامر بن عوف</text>
<text x="210" y="114" class="s" text-anchor="middle" direction="rtl">برنامج التوحد</text>

<rect x="45" y="155" width="1310" height="72" rx="16" fill="#d7eeee"/>
<text x="700" y="196" text-anchor="middle" class="h" direction="rtl">جدول الجلسات الأسبوعي</text>
<text x="700" y="220" text-anchor="middle" class="s" direction="rtl">طلاب برنامج التوحد</text>
<text x="1230" y="262" class="s" text-anchor="middle" direction="rtl">أخصائي النطق: عبدالله المطيري</text>

<!-- RTL table: day column on right, periods 1..7 from right to left -->
<g transform="translate(45 290)">
  <!-- merged header -->
  <rect class="th" x="0" y="0" width="1120" height="42"/>
  <rect class="th" x="1120" y="0" width="190" height="84"/>
  <text class="tht" x="560" y="28" text-anchor="middle" direction="rtl">الحصة</text>
  <text class="tht" x="1215" y="51" text-anchor="middle" direction="rtl">اليوم</text>

  <!-- period numbers: 7 on far left -> 1 next to day column -->
  <g class="tht" text-anchor="middle">
    <rect class="th" x="0" y="42" width="160" height="42"/><text x="80" y="70">7</text>
    <rect class="th" x="160" y="42" width="160" height="42"/><text x="240" y="70">6</text>
    <rect class="th" x="320" y="42" width="160" height="42"/><text x="400" y="70">5</text>
    <rect class="th" x="480" y="42" width="160" height="42"/><text x="560" y="70">4</text>
    <rect class="th" x="640" y="42" width="160" height="42"/><text x="720" y="70">3</text>
    <rect class="th" x="800" y="42" width="160" height="42"/><text x="880" y="70">2</text>
    <rect class="th" x="960" y="42" width="160" height="42"/><text x="1040" y="70">1</text>
  </g>

  <!-- Sunday -->
  <g transform="translate(0 84)" class="s" text-anchor="middle">
    <rect class="cell" x="0" y="0" width="160" height="74"/><rect class="cell" x="160" y="0" width="160" height="74"/><rect class="cell" x="320" y="0" width="160" height="74"/><rect class="cell" x="480" y="0" width="160" height="74"/><rect class="cell" x="640" y="0" width="160" height="74"/><rect class="cell" x="800" y="0" width="160" height="74"/><rect class="cell" x="960" y="0" width="160" height="74"/><rect class="day" x="1120" y="0" width="190" height="74"/>
    <text x="1040" y="45" direction="rtl">سلطان العصيمي</text><text x="880" y="45" direction="rtl">سلطان القوس</text><text x="720" y="45" direction="rtl">طلال العتيبي</text><text x="560" y="45" direction="rtl">عبدالحليم الفواعير</text><text x="1215" y="45" font-weight="700" direction="rtl">الأحد</text>
  </g>
  <!-- Monday -->
  <g transform="translate(0 158)" class="s" text-anchor="middle">
    <rect class="cell" x="0" y="0" width="160" height="74"/><rect class="cell" x="160" y="0" width="160" height="74"/><rect class="cell" x="320" y="0" width="160" height="74"/><rect class="cell" x="480" y="0" width="160" height="74"/><rect class="cell" x="640" y="0" width="160" height="74"/><rect class="cell" x="800" y="0" width="160" height="74"/><rect class="cell" x="960" y="0" width="160" height="74"/><rect class="day" x="1120" y="0" width="190" height="74"/>
    <text x="1040" y="45" direction="rtl">عبدالعزيز القحطاني</text><text x="880" y="45" direction="rtl">فواز الشمري</text><text x="720" y="45" direction="rtl">عبدالله العتيبي</text><text x="560" y="45" direction="rtl">عبدالله الرشيد</text><text x="1215" y="45" font-weight="700" direction="rtl">الاثنين</text>
  </g>
  <!-- Tuesday -->
  <g transform="translate(0 232)" class="s" text-anchor="middle">
    <rect class="cell" x="0" y="0" width="160" height="74"/><rect class="cell" x="160" y="0" width="160" height="74"/><rect class="cell" x="320" y="0" width="160" height="74"/><rect class="cell" x="480" y="0" width="160" height="74"/><rect class="cell" x="640" y="0" width="160" height="74"/><rect class="cell" x="800" y="0" width="160" height="74"/><rect class="cell" x="960" y="0" width="160" height="74"/><rect class="day" x="1120" y="0" width="190" height="74"/>
    <text x="1040" y="45" direction="rtl">وضاح صالح</text><text x="880" y="45" direction="rtl">عبدالعزيز القحطاني</text><text x="720" y="45" direction="rtl">فيصل السبيعي</text><text x="560" y="45" direction="rtl">محمد القحطاني</text><text x="1215" y="45" font-weight="700" direction="rtl">الثلاثاء</text>
  </g>
  <!-- Wednesday -->
  <g transform="translate(0 306)" class="s" text-anchor="middle">
    <rect class="cell" x="0" y="0" width="160" height="74"/><rect class="cell" x="160" y="0" width="160" height="74"/><rect class="cell" x="320" y="0" width="160" height="74"/><rect class="cell" x="480" y="0" width="160" height="74"/><rect class="cell" x="640" y="0" width="160" height="74"/><rect class="cell" x="800" y="0" width="160" height="74"/><rect class="cell" x="960" y="0" width="160" height="74"/><rect class="day" x="1120" y="0" width="190" height="74"/>
    <text x="1040" y="45" direction="rtl">مهاب الزهراني</text><text x="880" y="45" direction="rtl">نايف العتيبي</text><text x="720" y="45" direction="rtl">سلطان القوس</text><text x="560" y="45" direction="rtl">عبدالله العتيبي</text><text x="1215" y="45" font-weight="700" direction="rtl">الأربعاء</text>
  </g>
  <!-- Thursday -->
  <g transform="translate(0 380)" class="s" text-anchor="middle">
    <rect class="cell" x="0" y="0" width="160" height="74"/><rect class="cell" x="160" y="0" width="160" height="74"/><rect class="cell" x="320" y="0" width="160" height="74"/><rect class="cell" x="480" y="0" width="160" height="74"/><rect class="cell" x="640" y="0" width="160" height="74"/><rect class="cell" x="800" y="0" width="160" height="74"/><rect class="cell" x="960" y="0" width="160" height="74"/><rect class="day" x="1120" y="0" width="190" height="74"/>
    <text x="1040" y="45" direction="rtl">فراس هشام</text><text x="880" y="45" direction="rtl">عبدالله السبيعي</text><text x="1215" y="45" font-weight="700" direction="rtl">الخميس</text>
  </g>
</g>

<!-- approvals -->
<text x="1150" y="790" text-anchor="middle" class="sig" direction="rtl">أخصائي النطق</text><text x="1150" y="830" text-anchor="middle" class="s" direction="rtl">عبدالله المطيري</text>
<text x="700" y="790" text-anchor="middle" class="sig" direction="rtl">مشرف البرنامج</text><text x="700" y="830" text-anchor="middle" class="s" direction="rtl">معاذ الحمد</text>
<text x="250" y="790" text-anchor="middle" class="sig" direction="rtl">مدير المدرسة</text><text x="250" y="830" text-anchor="middle" class="s" direction="rtl">محمد ضيف الله السيحاني</text>
<line x1="45" y1="900" x2="1355" y2="900" stroke="#247f7b" stroke-width="5"/>
</svg>